    <circle cx="535" cy="361" r="4.5" fill="#15131f"/><path d="M532 362 L538 362 L537 374 L533 374 Z" fill="#15131f"/>
  </g>
  <!-- microphone on a stand -->
  <g>
    <line x1="235" y1="300" x2="235" y2="414" stroke="#b9bccb" stroke-width="6"/><ellipse cx="235" cy="416" rx="26" ry="6" fill="#b9bccb"/>
