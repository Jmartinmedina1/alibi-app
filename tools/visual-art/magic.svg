    <rect x="470" y="318" width="130" height="94" rx="6" fill="#7a4d2c" stroke="#3d2412" stroke-width="5"/>
    <rect x="466" y="306" width="138" height="20" rx="6" fill="#5e3a1f"/>
    <g stroke="#b9bccb" stroke-width="7" stroke-linecap="round"><line x1="474" y1="324" x2="596" y2="406"/><line x1="596" y1="324" x2="474" y2="406"/></g>
