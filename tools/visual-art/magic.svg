    <circle cx="80" cy="548" r="34"/><circle cx="190" cy="556" r="32"/><circle cx="300" cy="546" r="34"/><circle cx="410" cy="556" r="32"/><circle cx="520" cy="548" r="34"/><circle cx="630" cy="556" r="32"/><circle cx="740" cy="548" r="34"/>
