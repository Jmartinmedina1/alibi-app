    <path d="M391 247 Q398 252 405 247" stroke="#15131f" stroke-width="2.5" fill="none"/>
    <rect x="372" y="210" width="52" height="8" rx="3" fill="#15131f"/><rect x="382" y="168" width="32" height="44" rx="3" fill="#15131f"/><rect x="382" y="200" width="32" height="6" fill="#c62f2f"/>
    <path d="M428 280 L470 250" stroke="#15131f" stroke-width="12" stroke-linecap="round"/>
    <path d="M470 250 L500 226" stroke="#f2efe6" stroke-width="5" stroke-linecap="round"/>
