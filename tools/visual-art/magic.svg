    <rect x="378" y="350" width="14" height="62" rx="5" fill="#15131f"/><rect x="402" y="350" width="14" height="62" rx="5" fill="#15131f"/>
    <path d="M368 262 L428 262 L436 360 L360 360 Z" fill="#15131f"/>
    <path d="M388 262 L408 262 L398 300 Z" fill="#f2efe6"/>
