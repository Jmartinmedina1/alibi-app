  <g stroke="#8e1f1f" stroke-width="4" fill="none" stroke-linecap="round"><path d="M40 60 C45 200 40 320 42 415"/><path d="M95 60 C95 200 88 320 96 415"/><path d="M760 60 C755 200 760 320 758 415"/><path d="M705 60 C705 200 712 320 704 415"/></g>
  <!-- magician in the light -->
