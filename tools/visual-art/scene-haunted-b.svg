      <rect x="-14" y="350" width="38" height="76" rx="16" fill="#2f9aa6"/>
      <circle cx="5" cy="330" r="20" fill="#e8c39e"/><circle cx="14" cy="327" r="3" fill="#1b2b33"/>
      <path d="M-6 312 Q5 300 24 314 L24 322 Q8 312 -6 322 Z" fill="#4a2f22"/>
      <path d="M20 365 L48 345" stroke="#2f9aa6" stroke-width="10" stroke-linecap="round"/>
