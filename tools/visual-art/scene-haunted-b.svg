    <path d="M190 70 C185 200 188 320 190 415"/><path d="M165 70 C160 190 168 280 174 415"/>
  </g>
  <ellipse cx="88" cy="300" rx="14" ry="8" fill="#d9a441"/><ellipse cx="152" cy="300" rx="14" ry="8" fill="#d9a441"/>
  <!-- green floor trail -->
  <path d="M120 432 C 250 470, 360 438, 480 462 S 660 512, 800 492" stroke="#2fd36a" stroke-width="18" fill="none" opacity="0.25" stroke-linecap="round"/>
