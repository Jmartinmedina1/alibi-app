    <rect x="570" y="190" width="49" height="226" rx="3" fill="#8c5a33" stroke="#3d2412" stroke-width="3"/>
    <rect x="625" y="190" width="49" height="226" rx="3" fill="#8c5a33" stroke="#3d2412" stroke-width="3"/>
    <circle cx="612" cy="300" r="5" fill="#e3b45a"/><circle cx="632" cy="300" r="5" fill="#e3b45a"/>
    <rect x="608" y="318" width="28" height="44" rx="6" fill="#e3b45a" stroke="#3d2412" stroke-width="3"/>
    <circle cx="622" cy="333" r="6" fill="#15131f"/><path d="M618 334 L626 334 L624 352 L620 352 Z" fill="#15131f"/>
