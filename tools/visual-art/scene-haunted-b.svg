    <ellipse cx="727" cy="230" rx="6" ry="8" fill="#15131f"/><ellipse cx="748" cy="230" rx="6" ry="8" fill="#15131f"/>
    <path d="M728 252 Q737 258 746 252" stroke="#15131f" stroke-width="3" fill="none"/>
