  <g stroke="#2a1d17" stroke-width="3"><line x1="0" y1="455" x2="800" y2="455"/><line x1="0" y1="500" x2="800" y2="500"/><line x1="0" y1="540" x2="800" y2="540"/></g>
  <!-- entrance: dark doorway + red curtain -->
  <rect x="62" y="62" width="116" height="358" fill="#0b0a12"/>
  <rect x="20" y="48" width="200" height="14" rx="6" fill="#d9a441"/>
  <path d="M28 62 L120 62 C112 180 100 255 88 300 C82 340 84 385 94 420 L28 420 Z" fill="#c62f2f"/>
