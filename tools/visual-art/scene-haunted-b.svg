      <rect x="-10" y="380" width="30" height="56" rx="13" fill="#e2c35a"/>
      <circle cx="5" cy="364" r="16" fill="#f0d0b0"/><circle cx="13" cy="361" r="2.6" fill="#1b2b33"/>
      <path d="M-10 356 Q5 340 21 354 Q8 350 -10 362 Z" fill="#c4772e"/>
      <path d="M16 392 L36 376" stroke="#e2c35a" stroke-width="9" stroke-linecap="round"/>
