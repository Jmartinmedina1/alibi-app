<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <!-- ALIBI visual-bluff prototype illustration (original, simple shapes). Haunted House Attraction (Variant B copy: keyhole on the cupboard). -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#3a3560"/><stop offset="1" stop-color="#15131f"/></radialGradient>
  </defs>
  <rect width="800" height="560" fill="url(#glow)"/>
  <!-- wall panels -->
  <g fill="#ffffff" opacity="0.04"><rect x="240" y="0" width="70" height="400"/><rect x="400" y="0" width="70" height="400"/></g>
  <!-- cobwebs -->
  <g stroke="#cfc8e8" stroke-width="2" fill="none" opacity="0.5">
    <path d="M800 0 L720 0 M800 0 L800 80 M800 0 L740 60 M760 0 Q770 30 800 40 M735 0 Q755 45 800 62"/>
    <path d="M240 0 L300 0 M240 0 L280 40 M262 0 Q270 18 290 22"/>
  </g>
  <!-- floor -->
